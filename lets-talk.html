    <main class="talk-page">
      <button>
        <a href="index.html">Home</a>
      </button>

      <h1>Let's Talk</h1>
      <p class="talk-intro">
        Tell me about your project. Fill out the form below and I'll get back to
        you soon.
      </p>

      <form class="talk-form" id="talk-form">
        <label>
          Name
          <input type="text" name="name" placeholder="Your name" required />
        </label>

        <label>
          Email
          <input
            type="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </label>

        <label>
          Subject
          <input
            type="text"
            name="subject"
            placeholder="What would you like to discuss?"
            required
          />
        </label>

        <label>
          Message
          <textarea
            name="message"
            rows="6"
            placeholder="Share a few details about your project..."
            required
          ></textarea>
        </label>

        <button type="submit">Send message</button>
      </form>

      <p class="form-success" id="form-success" hidden>
        Thanks! Your message was sent. I'll reply soon.
      </p>
    </main>

    <script>
      document.getElementById("talk-form").addEventListener("submit", (event) => {
        event.preventDefault();
        event.target.hidden = true;
        document.getElementById("form-success").hidden = false;
      });
    </script>
  </body>
